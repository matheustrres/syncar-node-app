services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syncar
      POSTGRES_USER: syncar
      POSTGRES_PASSWORD: syncar-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncar -d syncar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
